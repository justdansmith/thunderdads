<style>
:root{--deep:#042c62;--green:#05397e;--ink:#1f2933;--muted:#52606d;--line:#dfe4ea;--amber:#fec322;--amber-ink:#8a5a00}
*{box-sizing:border-box}body{margin:0;font:17px/1.55 "Source Sans 3",system-ui,sans-serif;color:var(--ink);background:#fff}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:16px}
.brand{font-family:Montserrat,sans-serif;font-weight:700;font-size:1.2rem;color:var(--ink);text-decoration:none;line-height:1.1}.brand small{display:block;font:500 .75rem "Source Sans 3",sans-serif;color:var(--muted)}
header a.back{color:var(--green);font-weight:600;text-decoration:none}
h1{font-family:Montserrat,sans-serif;color:var(--deep);line-height:1.15;font-size:clamp(2rem,4.6vw,2.8rem);margin:30px 0 .2em}
.flag{display:inline-block;background:var(--amber);color:#1f2933;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;margin-top:34px}
.sub{color:var(--muted);max-width:62ch;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.item{font:inherit;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:inherit;position:relative}
.item svg{width:100%;height:auto;display:block;background:#eef1f6;border-radius:8px}
.item b{display:block;font-family:Montserrat,sans-serif;font-size:1.05rem;margin-top:8px;color:var(--deep)}.item span{color:var(--muted);font-size:.95rem}
.item[aria-pressed=true]{border-color:var(--green);background:#eef3fb}
.item .pick{display:none;position:absolute;top:10px;right:10px;background:var(--green);color:#fff;font-weight:700;font-size:.8rem;padding:3px 9px;border-radius:999px}
.item[aria-pressed=true] .pick{display:block}
.item:focus-visible,.btn:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:22px 0 0}
.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:600;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn[aria-disabled=true]{background:#e4e9f0;color:var(--muted);cursor:not-allowed}
#count{color:var(--muted)}
footer{color:var(--muted);font-size:.9rem;padding:30px 0 44px;margin-top:34px;border-top:1px solid var(--line)}

<script>(function(){var FORM=null,MAIL="thunderdads@thornhillschool.org",send=document.getElementById('send'),count=document.getElementById('count');
function picks(){return [].map.call(document.querySelectorAll('.item[aria-pressed=true]'),function(b){return b.getAttribute('data-name')})}
function upd(){var p=picks();if(!p.length){send.setAttribute('aria-disabled','true');send.setAttribute('href','#');count.textContent='Nothing picked yet.';return}
send.removeAttribute('aria-disabled');count.textContent=p.length+' picked: '+p.join(', ')+'.';
send.setAttribute('href',FORM?FORM:'mailto:'+MAIL+'?subject='+encodeURIComponent('Swag I would buy')+'&body='+encodeURIComponent('I would buy:\n- '+p.join('\n- ')+'\n\nMy name:\nShirt size:\n'))}
[].forEach.call(document.querySelectorAll('.item'),function(b){b.addEventListener('click',function(){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');upd()})});
send.addEventListener('click',function(e){if(send.getAttribute('aria-disabled')==='true')e.preventDefault()});})();</script>
